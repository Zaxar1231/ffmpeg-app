name: Release

# Adding release notes docs/releases/vX.Y.Z.md (X.Y.Z = pubspec version)
# builds Windows and Linux and publishes a GitHub release `vX.Y.Z` with the
# archives and SHA-256 sums; the tag is created by the release itself.
# Pushing a tag `vX.Y.Z` does the same.
on:
  push:
    branches: ['**']
    tags: ['v*']
    paths: ['docs/releases/**']
  workflow_dispatch:

env:
  FLUTTER_VERSION: '3.47.9'

permissions:
  contents: write

jobs:
  version:
    runs-on: ubuntu-24.04
    outputs:
      tag: ${{ steps.v.outputs.tag }}
    steps:
      - uses: actions/checkout@v4
      - id: v
        run: |
          v=$(sed -n 's/^version: *\([0-9.]*\).*/\1/p' pubspec.yaml)
          test -f "docs/releases/v$v.md" || { echo "docs/releases/v$v.md is missing"; exit 1; }
          echo "tag=v$v" >> "$GITHUB_OUTPUT"

  windows:
    needs: version
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true
      - run: flutter pub get
      - run: flutter test
      - run: flutter build windows --release
      - name: Pack
        shell: pwsh
        run: |
          $name = "kadra-${{ needs.version.outputs.tag }}-windows-x64"
          New-Item -ItemType Directory -Path "dist/$name" | Out-Null
          Copy-Item -Recurse build/windows/x64/runner/Release/* "dist/$name/"
          Compress-Archive -Path "dist/$name" -DestinationPath "dist/$name.zip"
      - uses: actions/upload-artifact@v4
        with:
          name: windows
          path: dist/*.zip

  linux:
    needs: version
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: System packages
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build libgtk-3-dev libmpv-dev ffmpeg xz-utils
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true
      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test
      - run: flutter build linux --release
      - name: Pack
        run: |
          name="kadra-${{ needs.version.outputs.tag }}-linux-x64"
          mkdir -p dist
          cp -r build/linux/x64/release/bundle "dist/$name"
          tar -C dist -czf "dist/$name.tar.gz" "$name"
      - uses: actions/upload-artifact@v4
        with:
          name: linux
          path: dist/*.tar.gz

  publish:
    needs: [version, windows, linux]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Checksums
        run: cd dist && sha256sum * > SHA256SUMS.txt && cat SHA256SUMS.txt
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.version.outputs.tag }}
          target_commitish: ${{ github.sha }}
          name: Kadra ${{ needs.version.outputs.tag }}
          body_path: docs/releases/${{ needs.version.outputs.tag }}.md
          files: dist/*
          fail_on_unmatched_files: true
