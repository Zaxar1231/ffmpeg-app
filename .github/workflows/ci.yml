name: CI

on:
  push:
    branches: ['**']
  pull_request:

env:
  FLUTTER_VERSION: '3.47.9'

jobs:
  test-linux:
    name: Analyze, test, build (Linux)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: System packages
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build libgtk-3-dev libmpv-dev libnotify-dev libx11-dev libxi-dev ffmpeg xz-utils zip
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true
      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test
      - run: flutter build linux --release
      # The same AppImage the release publishes (checks the packaging).
      - name: AppImage
        run: |
          curl -fsSL -o /tmp/appimagetool https://github.com/AppImage/appimagetool/releases/download/continuous/appimagetool-x86_64.AppImage
          chmod +x /tmp/appimagetool
          APPIMAGETOOL=/tmp/appimagetool APPIMAGE_EXTRACT_AND_RUN=1 \
            linux/packaging/build_appimage.sh build/linux/x64/release/bundle dist/Kadra-x86_64.AppImage
      - uses: actions/upload-artifact@v4
        with:
          name: kadra-linux-x64
          path: build/linux/x64/release/bundle
      - uses: actions/upload-artifact@v4
        with:
          name: kadra-linux-appimage
          path: dist/Kadra-x86_64.AppImage

  build-windows:
    name: Build (Windows)
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true
      - run: flutter pub get
      # Pure-Dart tests also run on Windows (process tests skip without ffmpeg).
      - run: flutter test
      - run: flutter build windows --release
      - name: Installer
        shell: pwsh
        run: |
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) { choco install innosetup -y --no-progress }
          $v = (Select-String -Path pubspec.yaml -Pattern '^version:\s*([^+\s]+)').Matches[0].Groups[1].Value
          $src = (Resolve-Path build/windows/x64/runner/Release).Path
          & $iscc /Qp "/DAppVersion=$v" "/DNumVersion=$($v -replace '-.*','')" "/DSourceDir=$src" "/DOutputName=kadra-setup" windows/installer/kadra.iss
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - uses: actions/upload-artifact@v4
        with:
          name: kadra-windows-x64
          path: build/windows/x64/runner/Release
      - uses: actions/upload-artifact@v4
        with:
          name: kadra-windows-setup
          path: dist/kadra-setup.exe
