name: CI

on:
  push:
    branches: ['**']
  pull_request:

env:
  FLUTTER_VERSION: '3.47.9'

jobs:
  test-linux:
    name: Analyze, test, build (Linux)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: System packages
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build libgtk-3-dev libmpv-dev ffmpeg xz-utils zip
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true
      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test
      - run: flutter build linux --release
      - uses: actions/upload-artifact@v4
        with:
          name: kadra-linux-x64
          path: build/linux/x64/release/bundle

  build-windows:
    name: Build (Windows)
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true
      - run: flutter pub get
      # Pure-Dart tests also run on Windows (process tests skip without ffmpeg).
      - run: flutter test
      - run: flutter build windows --release
      - uses: actions/upload-artifact@v4
        with:
          name: kadra-windows-x64
          path: build/windows/x64/runner/Release
